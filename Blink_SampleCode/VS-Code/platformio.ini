; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; The status-bar Build / Upload / Monitor buttons use this env.
; Others: `pio run -e wokwi-s3` (simulator), `pio run -e esp32s3box` (original, console on native USB).
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
framework = arduino
board_build.f_cpu = 240000000L

; N16R8: 16 MB flash (quad), 8 MB octal PSRAM -- same module as the NIOZ project.
; BOARD_HAS_PSRAM is NOT set here on purpose: PSRAM stays off, so GPIO 35/36/37
; (octal-PSRAM pins) can be blinked as plain pins.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; console: type a GPIO number + Enter, 77 = run left, 99 = run right, 100 = stop
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_filters = default, esp32_exception_decoder

lib_deps =
  # update to make the Console-Output easier (Streaming.h) ~ only accept bug-fixes of 1.0.0
  mikalhart/Streaming @ ~1.0.0

; ---------------------------------------------------------------------------
; Real kit over the CH340 USB-UART (COM5): Serial = UART0, so Build, Upload
; and Monitor all talk to the same port.
; The CH340 has no auto-reset: hold BOOT, tap RESET, release BOOT before
; Upload, then reset again to run (remove the bootstrap jumper if fitted).
; ---------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
upload_protocol = esptool
upload_port = COM5
monitor_port = COM5

; ---------------------------------------------------------------------------
; Wokwi simulator (diagram.json + wokwi.toml). Build, then F1 -> "Wokwi: Start Simulator".
; ---------------------------------------------------------------------------
[env:wokwi-s3]
board = esp32-s3-devkitc-1
build_type = debug
debug_build_flags = -Og -g3
build_flags =
  -DWOKWI
platform_packages =
  platformio/tool-xtensa-esp-elf-gdb

; ---------------------------------------------------------------------------
; Original env: console on native USB (ARDUINO_USB_CDC_ON_BOOT=1).
; Needs the kit's second (USB) connector, COM port differs from COM5.
; ---------------------------------------------------------------------------
[env:esp32s3box]
board = esp32s3box
board_build.mcu = esp32s3
